[project]
name = "github-api-package"
description = "Python module for interacting with the GitHub API."
authors = [
    {name = "ONS-Innovation/keh-dev"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jwt (>=1.4.0,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/ONS-Innovation/github-api-package"

[tool.poetry]
# IMPORTANT: do not set package-mode = false
packages = [{ include = "github_api_toolkit", from = "src" }]
version = "0.0.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.15"
mkdocstrings-python = "^1.16.12"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-xdist = "^3.8.0"
pytest-cov = "^7.1.0"
ruff = "^0.16.8"
mypy = "^2.3.1"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.10.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
